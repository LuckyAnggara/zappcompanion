name: Release

on:
  workflow_dispatch: # Allow manual trigger
  push:
    tags:
      - 'v*' # Trigger workflow when a tag like v1.0.0 is pushed

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false # Don't cancel Windows if Mac fails
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Use a more stable LTS version
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build and Release Electron App
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: true
          # mac_certs: ${{ secrets.MAC_CERTS }} # Uncomment if you have Apple Developer Certificates
          # mac_certs_password: ${{ secrets.MAC_CERTS_PASSWORD }}
